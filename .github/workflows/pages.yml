name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build dashboard with plain local OKR data
        run: |
          cp index-fixed.html index.html
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/dekipermanarg-max/dashboard-okr-bac-2627/ce4432333b2a00eb715c96a7a7e812c2ba96f7c7/data.js" -o source-bundle.js
          python3 - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path
          s=Path('source-bundle.js').read_text()
          def unpack(name):
              m=re.search(rf'{name}:`([^`]*)`', s)
              if not m:
                  raise SystemExit(f'Missing {name}')
              return json.loads(gzip.decompress(base64.b64decode(m.group(1))))
          app=unpack('dataGzipB64')
          master=unpack('masterGzipB64')
          target=unpack('targetGzipB64')
          if not isinstance(app,dict) or not app.get('data'):
              raise SystemExit('Decoded APP data is empty')
          if not isinstance(master,list) or not master:
              raise SystemExit('Decoded master data is empty')
          out='window.__OKR_DATA='+json.dumps({'app':app,'master':master,'target':target},ensure_ascii=False,separators=(',',':'))+';'
          Path('okr-data.js').write_text(out,encoding='utf-8')
          print(f'OKR data built: {len(app.get("data",[]))} rows, {len(master)} master rows, {len(app.get("metrics",[]))} metrics')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="data.js"></script>'
          new='<script src="okr-data.js"></script><script src="boot.js"></script>'
          if old not in s:
              raise SystemExit('Expected data.js script tag not found')
          p.write_text(s.replace(old,new))
          PY
          test -s okr-data.js
          wc -c okr-data.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
