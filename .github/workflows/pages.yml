name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build dashboard
        run: |
          cp index-fixed.html index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<link rel="stylesheet" href="ui.css">'
          new='<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="logo.css">'
          if old not in s:
              raise SystemExit('Expected ui.css stylesheet tag not found')
          s=s.replace(old,new)
          old='<script src="data.js"></script>'
          new='<script src="okr-data.js"></script><script src="boot.js"></script>'
          if old not in s:
              raise SystemExit('Expected data.js script tag not found')
          p.write_text(s.replace(old,new))
          PY
          test -s okr-data.js
          test -s logo.css
          test -s logo.svg
          wc -c okr-data.js logo.css logo.svg
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
